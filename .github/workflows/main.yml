name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

jobs:
  tox:
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - os: ubuntu-latest
            tox-skip-env: $^
          - os: macOS-latest
            tox-skip-env: pypy3.*
          - os: windows-latest
            tox-skip-env: pypy3.*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            pypy3.11
            3.10
            3.11
            3.12
            3.13
            3.14
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg

      - name: Install
        run: |
          pip install tox

      - name: tox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOX_PARALLEL_NO_SPINNER: 1
          TOX_SKIP_ENV: ${{ matrix.cfg.tox-skip-env }}
        run:
          tox --parallel=all
          -e'py{310,311,312,313,314,py3}-test-{twlatest,twtrunk},publishcov,py313-linters,release'

      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cfg.os }}_dist
          path: dist

  all-successful:
    # https://github.community/t/is-it-possible-to-require-all-github-actions-tasks-to-pass-without-enumerating-them/117957/4?u=graingert
    runs-on: ubuntu-latest
    needs: [tox]
    steps:
      - name: Download dists for PyPI
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest_dist
          path: dist

      - name: Display structure of downloaded files
        run: ls -R

      - name: Publish to PyPI for a new tag
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_GITHUB_PACKAGE_UPLOAD }}

      - name: note that all tests succeeded
        run: echo "all green"
