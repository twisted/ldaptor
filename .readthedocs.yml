version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py
  # ponytail: fail_on_warning off until the ~35 pre-existing missing-xref
  # warnings in cookbook/ are cleaned up. Re-enable once those are gone.

formats:
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
